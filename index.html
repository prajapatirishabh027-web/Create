<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>Someone Made This For You ✨</title>
<style>
:root{
  --bg1:#fff1f5;--bg2:#ffe4e9;--card:#ffffff;--ink:#1e131b;--muted:#6e5766;
  --accent:#e11d48;--accent2:#fb7185;--soft:#ffe4e9;--line:rgba(30,19,27,0.08);
  --shadow:0 18px 42px rgba(225,29,72,0.14);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;-webkit-font-smoothing:antialiased;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:16px;}
#particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.pt{position:absolute;bottom:-40px;font-size:20px;opacity:.55;animation:rise linear infinite;will-change:transform;}
@keyframes rise{0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}15%{opacity:.6}85%{opacity:.6}100%{transform:translate3d(0,-110vh,0) rotate(22deg);opacity:0}}

.top-bar{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:8px;align-items:center;}
.pill-btn{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.06);display:inline-flex;align-items:center;gap:6px;transition:transform .15s;}
.pill-btn:active{transform:scale(.95);}

.stage{position:relative;z-index:10;width:100%;max-width:430px;margin:auto;}
.card{background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow);border:1px solid var(--line);text-align:center;animation:popIn .38s cubic-bezier(.22,1,.36,1) both;}
@keyframes popIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.97)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}

.step-dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px;}
.dot{width:7px;height:7px;border-radius:99px;background:var(--soft);transition:all .25s;}
.dot.active{width:22px;background:var(--accent);}
.dot.done{background:var(--accent2);}

.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px;}
h1{font-size:25px;line-height:1.22;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;}
h2{font-size:21px;line-height:1.25;font-weight:800;margin-bottom:8px;}
p.sub{font-size:14.5px;line-height:1.5;color:var(--muted);margin-bottom:18px;}

.btn{width:100%;border:none;border-radius:16px;padding:15px 18px;font-size:15.5px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 10px 22px rgba(0,0,0,.12);transition:transform .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;}
.btn-soft{background:var(--soft);color:var(--accent);box-shadow:none;}

/* Knock door */
.door-box{background:linear-gradient(145deg,var(--soft),#fff);border:2px dashed var(--accent2);border-radius:24px;padding:26px 18px;margin:14px 0 18px;cursor:pointer;user-select:none;transition:transform .12s;}
.door-box:active{transform:scale(.96);}
.door-icon{font-size:56px;display:inline-block;transition:transform .2s;}
.knock-shake{animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.08)}50%{transform:rotate(12deg) scale(1.08)}75%{transform:rotate(-6deg)}}
.knock-pills{display:flex;justify-content:center;gap:8px;margin-top:12px;}
.k-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);transition:background .2s,transform .2s;}
.k-dot.lit{background:var(--accent);transform:scale(1.2);}

/* Counter badge */
.counter-card{background:var(--soft);border-radius:18px;padding:14px;margin-bottom:16px;}
.counter-num{font-size:32px;font-weight:900;color:var(--accent);line-height:1.1;}
.counter-lbl{font-size:12.5px;font-weight:600;color:var(--muted);}

/* Scratch Gallery */
.scratch-wrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--soft);margin-bottom:10px;box-shadow:0 10px 24px rgba(0,0,0,.08);touch-action:none;}
.scratch-img{width:100%;height:100%;object-fit:cover;display:block;}
.scratch-fallback{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--soft),#fff);font-size:48px;}
#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;}
.gallery-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.g-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
.caption-txt{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:14px;}

/* 9-Piece Puzzle */
.puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:290px;aspect-ratio:1/1;margin:0 auto 14px;background:var(--soft);padding:6px;border-radius:18px;}
.p-tile{border-radius:10px;background-size:300% 300%;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent;position:relative;}
.p-tile.sel{border-color:var(--accent);transform:scale(.94);box-shadow:0 0 0 3px var(--soft);}
.puzzle-meta{display:flex;justify-content:center;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:12px;}

/* Note Wall / Balloons */
.notes-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;}
.note-item{background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .22s;text-align:left;display:flex;align-items:center;gap:12px;}
.note-item.opened{background:#fff;border-color:var(--accent2);box-shadow:0 6px 16px rgba(0,0,0,.05);}
.note-icon{font-size:24px;flex-shrink:0;}
.note-text{font-size:14px;font-weight:600;line-height:1.4;}

/* Sealed Letter */
.envelope{background:linear-gradient(155deg,#fff,var(--soft));border:1.5px solid var(--accent2);border-radius:22px;padding:24px 18px;margin-bottom:16px;position:relative;}
.wax-seal{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:10px auto 12px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.18);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.letter-paper{text-align:left;background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line);font-size:15px;line-height:1.65;white-space:pre-line;animation:popIn .35s ease;}
.letter-sign{margin-top:14px;font-weight:800;color:var(--accent);text-align:right;}

/* Promises + Finger Signature */
.promise-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;text-align:left;}
.prom-row{display:flex;align-items:center;gap:10px;background:var(--soft);padding:12px 14px;border-radius:14px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s;}
.prom-row.checked{background:#fff;border:1.5px solid var(--accent);}
.prom-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;}
.prom-row.checked .prom-box{background:var(--accent);}
.sig-wrap{margin:10px 0 14px;text-align:left;}
.sig-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
#sigCanvas{width:100%;height:110px;background:#fafafa;border:1.5px dashed var(--accent2);border-radius:14px;touch-action:none;display:block;}

/* Final Question + Dodging No */
.gif-box{width:170px;height:170px;margin:0 auto 14px;border-radius:22px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.08);}
.gif-box img{width:100%;height:100%;object-fit:cover;}
.ans-row{display:flex;gap:12px;justify-content:center;align-items:center;min-height:64px;position:relative;margin-top:10px;}
#yesBtn{flex:1;max-width:210px;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
#noBtn{padding:14px 18px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:14.5px;cursor:pointer;transition:transform .15s;}

/* Keepsake Certificate */
.cert{background:linear-gradient(155deg,#fff 0%,var(--soft) 100%);border:2px solid var(--accent2);border-radius:24px;padding:22px 18px;margin-bottom:14px;}
.cert-sig{max-height:54px;margin:8px auto 2px;display:block;}

/* Secret Creator Studio (#studio) */
#studioModal{position:fixed;inset:0;background:rgba(15,10,15,.65);backdrop-filter:blur(8px);z-index:100;display:none;overflow-y:auto;padding:16px;}
.studio-card{background:#fff;max-width:480px;margin:10px auto 40px;border-radius:26px;padding:22px;text-align:left;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.studio-card h2{margin-bottom:4px;}
.st-group{margin-top:14px;}
.st-label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;}
.st-input,.st-area,.st-select{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;color:#111;}
.st-area{min-height:82px;resize:vertical;}
.mood-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.m-pill{border:1.5px solid #e5e7eb;background:#fff;border-radius:12px;padding:8px 6px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;}
.m-pill.active{border-color:var(--accent);background:var(--soft);color:var(--accent);}
.photo-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.p-chip{background:#f3f4f6;border-radius:10px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px;}
.share-box{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:14px;padding:12px;margin-top:14px;word-break:break-all;font-size:12px;color:#334155;}
.st-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
</style>
</head>
<body>
<div id="particles"></div>

<div class="top-bar">
  <button class="pill-btn" id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>
</div>

<main class="stage" id="app"></main>

<!-- Secret Creator Studio (Only opens via #studio) -->
<div id="studioModal">
  <div class="studio-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div class="eyebrow">Private Creator Studio</div>
        <h2>Build Your Experience</h2>
      </div>
      <button class="g-btn" onclick="closeStudio()">✕ Close</button>
    </div>

    <div class="st-group">
      <label class="st-label">1. Experience Mode</label>
      <div class="mood-pills" id="moodPills"></div>
    </div>

    <div class="st-group" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div>
        <label class="st-label">Their Name</label>
        <input class="st-input" id="stTo" placeholder="e.g. Ananya">
      </div>
      <div>
        <label class="st-label">Your Name</label>
        <input class="st-input" id="stFrom" placeholder="e.g. Rishabh">
      </div>
    </div>

    <div class="st-group" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div>
        <label class="st-label">Days Together (Optional)</label>
        <input class="st-input" id="stDays" type="number" placeholder="e.g. 365">
      </div>
      <div>
        <label class="st-label">Wax Seal Emoji</label>
        <input class="st-input" id="stSeal" value="💞">
      </div>
    </div>

    <div class="st-group">
      <label class="st-label">2. Notes / Balloons (1 per line, up to 4)</label>
      <textarea class="st-area" id="stNotes"></textarea>
    </div>

    <div class="st-group">
      <label class="st-label">3. Sealed Letter</label>
      <textarea class="st-area" id="stLetter"></textarea>
    </div>

    <div class="st-group">
      <label class="st-label">4. Promises / Rules (1 per line, up to 4)</label>
      <textarea class="st-area" id="stPromises"></textarea>
    </div>

    <div class="st-group">
      <label class="st-label">5. Final Question & Cute GIF URL</label>
      <input class="st-input" id="stQuestion" style="margin-bottom:6px;" placeholder="Do you love me? 🥰">
      <input class="st-input" id="stSubQ" style="margin-bottom:6px;" placeholder="My heart beats faster every time I see you...">
      <input class="st-input" id="stGif" placeholder="Optional GIF URL (leave blank for built-in animated heart)">
    </div>

    <div class="st-group">
      <label class="st-label">6. Photos for Scratch Gallery & 9-Piece Puzzle (Up to 3)</label>
      <input type="file" id="stPhotoInput" accept="image/*" multiple style="font-size:13px;">
      <div class="photo-chips" id="photoChips"></div>
    </div>

    <div class="st-group">
      <label class="st-label">7. Background Song MP3 URL (Optional)</label>
      <input class="st-input" id="stAudio" placeholder="https://...mp3 (built-in piano plays if empty)">
    </div>

    <div class="st-group">
      <button class="btn" onclick="buildShareLink()">✨ Generate Private Link</button>
      <div class="share-box" id="shareOut" style="display:none;"></div>
      <div class="st-actions" id="shareBtns" style="display:none;">
        <button class="btn btn-soft" onclick="copyShareLink()">📋 Copy Link</button>
        <button class="btn" style="background:#16a34a;" onclick="shareWhatsApp()">💬 WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<audio id="bgAudio" loop preload="none"></audio>

<script>
const PRESETS = {
  girlfriend: {
    label:"💞 Girlfriend", bg1:"#fff1f5", bg2:"#ffe4e9", accent:"#e11d48", accent2:"#fb7185", soft:"#ffe4e9",
    emojis:["💞","✨","🌹","💖","🥰"], seal:"💞",
    introTitle:"Closed to everyone. Except you.",
    introSub:"Someone built a private museum of us. Knock three times to step inside.",
    notes:["You make ordinary days feel like magic.","The way you laugh is my favourite sound.","You feel like home no matter where we are.","You are the best part of every single day."],
    letter:"I don't say this enough, so I made you a little corner of the internet just to remind you: choosing you is the easiest decision I ever make. Thank you for every late-night talk, every smile, and every quiet moment.",
    promises:["Never go to bed angry","Always share the last bite","Hold your hand in every crowd","Choose you again every morning"],
    question:"Do you love me? 🥰",
    subQ:"My heart beats faster every time I see your smile... ❤",
    yesLabel:"Yes! 💍", noLabel:"No 🥺",
    celeTitle:"Yaaay! I Knew It! 🎉",
    celeSub:"You just made me the happiest person alive. Forever & always! ❤💍✨"
  },
  apology: {
    label:"🥺 Apology", bg1:"#eff6ff", bg2:"#dbeafe", accent:"#2563eb", accent2:"#60a5fa", soft:"#dbeafe",
    emojis:["💙","🕊️","🥺","✨","🫂"], seal:"💙",
    introTitle:"A quiet letter waiting for you.",
    introSub:"Someone made this with a heavy heart. Knock three times to open it.",
    notes:["I hate knowing that I hurt you.","You deserved patience and kindness from me.","I am owning my mistake with zero excuses.","Your smile means more to me than my pride."],
    letter:"I'm truly sorry. I wish I could rewind and handle things better, because hurting you is the last thing I ever wanted. Take all the time you need—I'm right here ready to listen and make it right.",
    promises:["Listen first before reacting","Never brush your feelings aside","Show up and do better every day","Always protect what we have"],
    question:"Will you forgive me? 🥺",
    subQ:"I promise to make it up to you with all my heart... 💙",
    yesLabel:"Yes, I forgive you 💙", noLabel:"Not yet 😤",
    celeTitle:"Thank You For Forgiving Me 🫂",
    celeSub:"I promise I won't take your heart for granted again. 💙✨"
  },
  surprise: {
    label:"❤️ Surprise", bg1:"#fff1f2", bg2:"#fecdd3", accent:"#be123c", accent2:"#f43f5e", soft:"#ffe4e6",
    emojis:["❤️","✨","🎁","💫","💖"], seal:"❤️",
    introTitle:"Someone has a secret for you.",
    introSub:"Made by hand for one visitor only. Knock three times to unlock.",
    notes:["You crossed my mind today and I smiled.","Nobody else gets me the way you do.","Life is ten times brighter with you around.","Here is a tiny reminder of how special you are."],
    letter:"No big reason—just wanted to surprise you and remind you how deeply appreciated you are. Whenever you have a long day, come back to this little page and remember someone is cheering for you.",
    promises:["Keep surprising you randomly","Always be in your corner","Make time for our favorite things","Never stop celebrating you"],
    question:"Did this make you smile? 😊",
    subQ:"Be honest—even a tiny smile counts! ✨",
    yesLabel:"Huge smile! 😍", noLabel:"Nope 🙈",
    celeTitle:"Mission Accomplished! 🎉",
    celeSub:"Your smile is literally the whole point. ❤️✨"
  },
  birthday: {
    label:"🎂 Birthday", bg1:"#fffbeb", bg2:"#fef3c7", accent:"#d97706", accent2:"#f59e0b", soft:"#fef3c7",
    emojis:["🎂","🎈","✨","🥳","💛"], seal:"🎂",
    introTitle:"It's officially your day!",
    introSub:"Someone wrapped up a birthday adventure for you. Knock three times!",
    notes:["The world got brighter the day you were born.","You make everyone around you feel loved.","Here's to your biggest, happiest year yet.","Thank you for being unapologetically you."],
    letter:"Happy Birthday to someone truly unforgettable! I hope this year brings you peace, loud laughter, late-night adventures, and every dream you've been quietly wishing for.",
    promises:["Always celebrate your wins","Bring cake whenever you need a lift","Be there for every chapter ahead","Make this your best year yet"],
    question:"Ready for the best year ever? 🎂",
    subQ:"Make a wish before you tap! ✨",
    yesLabel:"Let's gooo! 🥳", noLabel:"Still sleepy 😴",
    celeTitle:"Happy Birthday Star! 🎂🎉",
    celeSub:"Wishing you endless happiness today and always! 💛✨"
  },
  friendship: {
    label:"💚 Friendship", bg1:"#ecfdf5", bg2:"#d1fae5", accent:"#059669", accent2:"#34d399", soft:"#d1fae5",
    emojis:["💚","🤝","⭐","🔥","♾️"], seal:"🤝",
    introTitle:"One Visitor Only: Bestie Museum",
    introSub:"Someone built a tribute to our chaos. Knock three times to enter.",
    notes:["You never let me spiral alone.","You laugh at my worst jokes every time.","One call and I know you're already there.","You know all my stories and still stayed."],
    letter:"Real friendship is rare, and having you in my corner is one of my biggest flexes. Through chaotic days, 2 AM rants, and random inside jokes—thank you for being my ride or die.",
    promises:["Reply within one business week","Keep every secret forever","Roast in private, defend in public","Split the last slice always"],
    question:"Besties for life? 🤝",
    subQ:"No option to cancel this contract! 💚",
    yesLabel:"Ride or die! 🔥", noLabel:"Let me think 🤔",
    celeTitle:"Friendship Renewed Forever! 💚",
    celeSub:"Locked in for life. Thanks for being my favorite human! 🤝✨"
  }
};

function detectRouteMood(){
  const p = location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
  if(PRESETS[p]) return p;
  const q = new URLSearchParams(location.search).get('type');
  if(q && PRESETS[q]) return q;
  return 'girlfriend';
}

let state = {
  mood: detectRouteMood(),
  to: "You",
  from: "Someone who loves you",
  days: "",
  seal: "",
  notes: [],
  letter: "",
  promises: [],
  question: "",
  subQ: "",
  gif: "",
  audio: "",
  photos: []
};

function applyMoodDefaults(m, force){
  const p = PRESETS[m] || PRESETS.girlfriend;
  state.mood = m;
  if(force || !state.seal) state.seal = p.seal;
  if(force || !state.notes.length) state.notes = [...p.notes];
  if(force || !state.letter) state.letter = p.letter;
  if(force || !state.promises.length) state.promises = [...p.promises];
  if(force || !state.question) state.question = p.question;
  if(force || !state.subQ) state.subQ = p.subQ;
  const r = document.documentElement.style;
  r.setProperty('--bg1', p.bg1);
  r.setProperty('--bg2', p.bg2);
  r.setProperty('--accent', p.accent);
  r.setProperty('--accent2', p.accent2);
  r.setProperty('--soft', p.soft);
  spawnParticles(p.emojis);
}

// Decode URL payload if present
(function loadPayload(){
  try{
    const d = new URLSearchParams(location.search).get('d');
    if(d){
      const json = decodeURIComponent(escape(atob(d)));
      const parsed = JSON.parse(json);
      state = Object.assign(state, parsed);
    }
  }catch(e){}
  applyMoodDefaults(state.mood, false);
})();

// Lightweight GPU Particles (capped at 9 nodes)
function spawnParticles(emojis){
  const box = document.getElementById('particles');
  box.innerHTML = '';
  for(let i=0;i<9;i++){
    const s = document.createElement('span');
    s.className = 'pt';
    s.textContent = emojis[i % emojis.length];
    s.style.left = (6 + i*10.5) + '%';
    s.style.animationDuration = (7 + (i%5)*1.6) + 's';
    s.style.animationDelay = (-i*1.1) + 's';
    box.appendChild(s);
  }
}

// Built-in Web Audio Romantic Chime + MP3 Support
let audioCtx = null, synthTimer = null, isPlaying = false;
function toggleMusic(){
  const btn = document.getElementById('musicBtn');
  const el = document.getElementById('bgAudio');
  if(isPlaying){
    isPlaying = false;
    el.pause();
    clearInterval(synthTimer);
    btn.textContent = '🎵 Play Music';
    return;
  }
  isPlaying = true;
  btn.textContent = '⏸ Pause Music';
  if(state.audio){
    el.src = state.audio;
    el.play().catch(()=>startSynth());
  } else {
    startSynth();
  }
}
function startSynth(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [261.63, 329.63, 392.00, 493.88, 523.25, 493.88, 392.00, 329.63];
    let idx = 0;
    const playNote = () => {
      if(!isPlaying) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = notes[idx % notes.length];
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.05, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 1.15);
      idx++;
    };
    playNote();
    synthTimer = setInterval(playNote, 750);
  }catch(e){}
}

// Journey Flow (OurMoments 7-Stage Interactive Mechanism)
// Steps: 0=Knock Door, 1=Scratch Gallery, 2=9-Piece Puzzle, 3=Note Wall, 4=Wax-Sealed Letter, 5=Promises+Signature, 6=Question+Dodging No, 7=Celebration+Keepsake
let step = 0, knocks = 0, galIdx = 0, openedNotes = new Set(), letterUnsealed = false, checkedProms = new Set(), hasSigned = false, sigDataUrl = "", yesScale = 1, noDodges = 0;

function renderDots(total=7){
  let h = '<div class="step-dots">';
  for(let i=0;i<total;i++){
    h += `<span class="dot ${i===step?'active':(i<step?'done':'')}"></span>`;
  }
  return h + '</div>';
}

function render(){
  const app = document.getElementById('app');
  const p = PRESETS[state.mood] || PRESETS.girlfriend;

  if(step === 0){
    app.innerHTML = `<div class="card">
      <div class="eyebrow">Private Experience • For ${esc(state.to)}</div>
      <h1>${esc(p.introTitle)}</h1>
      <p class="sub">${esc(p.introSub)}</p>
      ${state.days ? `<div class="counter-card"><div class="counter-num">${esc(state.days)}</div><div class="counter-lbl">Days of Us, So Far ✨</div></div>` : ''}
      <div class="door-box" onclick="doKnock()">
        <span class="door-icon" id="doorIcon">🚪</span>
        <div style="font-weight:800;margin-top:8px;">Tap to knock (${knocks}/3)</div>
        <div class="knock-pills">
          <span class="k-dot ${knocks>=1?'lit':''}"></span>
          <span class="k-dot ${knocks>=2?'lit':''}"></span>
          <span class="k-dot ${knocks>=3?'lit':''}"></span>
        </div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);">Handcrafted by <b>${esc(state.from)}</b></div>
    </div>`;
  }
  else if(step === 1){
    const photos = getPhotos();
    const cur = photos[galIdx % photos.length];
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">Room 1 • The Gallery</div>
      <h2>Rub to Reveal Memory</h2>
      <p class="sub">Scratch across the card with your finger to uncover it.</p>
      <div class="scratch-wrap" id="scratchWrap">
        ${cur.url ? `<img class="scratch-img" src="${cur.url}" alt="Memory">` : `<div class="scratch-fallback"><div>${cur.emoji}</div><div style="font-size:15px;font-weight:700;margin-top:8px;">${esc(cur.cap)}</div></div>`}
        <canvas id="scratchCanvas"></canvas>
      </div>
      <div class="caption-txt">${esc(cur.cap)} (${galIdx+1}/${photos.length})</div>
      ${photos.length > 1 ? `<div class="gallery-nav">
        <button class="g-btn" onclick="navGal(-1)">← Prev</button>
        <button class="g-btn" onclick="navGal(1)">Next →</button>
      </div>` : ''}
      <button class="btn" onclick="nextStep()">Keep Walking →</button>
    </div>`;
    initScratch();
  }
  else if(step === 2){
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">Room 2 • Restoration Desk</div>
      <h2>Put This Moment Together</h2>
      <p class="sub">Tap any two tiles to swap them back into order.</p>
      <div class="puzzle-grid" id="puzzleGrid"></div>
      <div class="puzzle-meta"><span id="puzMoves">Moves: 0</span><span>•</span><span>9-Piece Memory</span></div>
      <button class="btn" id="puzNextBtn" onclick="nextStep()">Next Room →</button>
    </div>`;
    initPuzzle();
  }
  else if(step === 3){
    const allOpen = openedNotes.size >= state.notes.length;
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">Room 3 • The Note Wall</div>
      <h2>Tap Each Note to Open</h2>
      <p class="sub">Little truths written just for ${esc(state.to)}.</p>
      <div class="notes-grid">
        ${state.notes.map((n,i)=>{
          const open = openedNotes.has(i);
          return `<div class="note-item ${open?'opened':''}" onclick="openNote(${i})">
            <span class="note-icon">${open ? p.emojis[i%p.emojis.length] : '💌'}</span>
            <span class="note-text">${open ? esc(n) : 'Tap to unfold note #' + (i+1)}</span>
          </div>`;
        }).join('')}
      </div>
      <button class="btn" ${allOpen?'':'disabled'} onclick="nextStep()">${allOpen ? 'Next Room →' : `Open all notes (${openedNotes.size}/${state.notes.length})`}</button>
    </div>`;
  }
  else if(step === 4){
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">Room 4 • The Reading Room</div>
      <h2>A Letter Sealed For You</h2>
      <p class="sub">${letterUnsealed ? 'Read every word slowly.' : 'Tap the wax seal below to break it open.'}</p>
      <div class="envelope">
        ${!letterUnsealed ? `
          <div class="wax-seal" onclick="breakSeal()">${esc(state.seal)}</div>
          <div style="font-size:13px;font-weight:700;color:var(--accent);">Tap seal to break</div>
        ` : `
          <div class="letter-paper">
            <div>Dear ${esc(state.to)},</div><br>
            <div>${esc(state.letter)}</div>
            <div class="letter-sign">— ${esc(state.from)} ${esc(state.seal)}</div>
          </div>
        `}
      </div>
      <button class="btn" ${letterUnsealed?'':'disabled'} onclick="nextStep()">One Last Room →</button>
    </div>`;
  }
  else if(step === 5){
    const ready = checkedProms.size >= state.promises.length && hasSigned;
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">Room 5 • Our Promises</div>
      <h2>Tick Each One & Sign</h2>
      <p class="sub">Seal these promises together before the final question.</p>
      <div class="promise-list">
        ${state.promises.map((pr,i)=>{
          const chk = checkedProms.has(i);
          return `<div class="prom-row ${chk?'checked':''}" onclick="toggleProm(${i})">
            <span class="prom-box">${chk?'✓':''}</span>
            <span>${esc(pr)}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="sig-wrap">
        <div class="sig-head"><span>Sign with your finger</span><span style="color:var(--accent);cursor:pointer;" onclick="clearSig()">Clear</span></div>
        <canvas id="sigCanvas"></canvas>
      </div>
      <button class="btn" ${ready?'':'disabled'} onclick="saveSigAndNext()">Continue →</button>
    </div>`;
    initSigPad();
  }
  else if(step === 6){
    app.innerHTML = `<div class="card">
      ${renderDots()}
      <div class="eyebrow">A Special Question For ${esc(state.to)}</div>
      <div class="gif-box">
        ${state.gif ? `<img src="${esc(state.gif)}" alt="Cute visual">` : `<div style="font-size:74px;animation:pulse 1.3s infinite;">${esc(state.seal)}</div>`}
      </div>
      <h1>${esc(state.question)}</h1>
      <p class="sub">"${esc(state.subQ)}"</p>
      <div class="ans-row">
        <button class="btn" id="yesBtn" style="transform:scale(${yesScale})" onclick="sayYes()">${esc(p.yesLabel)}</button>
        <button id="noBtn" onmouseover="dodgeNo()" ontouchstart="dodgeNo()" onclick="dodgeNo()">${esc(p.noLabel)}</button>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:14px;">Choose honestly with all your heart ✨</div>
    </div>`;
  }
  else if(step === 7){
    app.innerHTML = `<div class="card">
      <div class="eyebrow">Forever & Always</div>
      <h1>${esc(p.celeTitle)}</h1>
      <p class="sub">${esc(p.celeSub)}</p>
      <div class="cert">
        <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;">Official Keepsake</div>
        <div style="font-size:20px;font-weight:900;margin:6px 0;">${esc(state.to)} & ${esc(state.from)}</div>
        ${state.days ? `<div style="font-size:13px;color:var(--muted);">${esc(state.days)} days & counting</div>` : ''}
        ${sigDataUrl ? `<img class="cert-sig" src="${sigDataUrl}" alt="Signature">` : ''}
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">Signed & sealed with love ${esc(state.seal)}</div>
      </div>
      <button class="btn btn-soft" onclick="replayAll()">Play Again ↺</button>
    </div>`;
    burstConfetti(p.emojis);
  }
}

function nextStep(){ step++; render(); }
function replayAll(){ step=0; knocks=0; openedNotes.clear(); letterUnsealed=false; checkedProms.clear(); hasSigned=false; yesScale=1; noDodges=0; render(); }

function doKnock(){
  knocks++;
  const ic = document.getElementById('doorIcon');
  if(ic){ ic.classList.remove('knock-shake'); void ic.offsetWidth; ic.classList.add('knock-shake'); }
  if(knocks >= 3){
    setTimeout(()=>{ step=1; render(); }, 320);
  } else {
    render();
  }
}

function getPhotos(){
  if(state.photos && state.photos.length) return state.photos;
  const p = PRESETS[state.mood] || PRESETS.girlfriend;
  return [
    {url:"", emoji:p.emojis[0], cap:"Chapter 1 • The day everything changed"},
    {url:"", emoji:p.emojis[1], cap:"Chapter 2 • My favorite memory with you"}
  ];
}

// Scratch Canvas
function navGal(dir){
  const len = getPhotos().length;
  galIdx = (galIdx + dir + len) % len;
  render();
}
function initScratch(){
  const c = document.getElementById('scratchCanvas');
  const w = document.getElementById('scratchWrap');
  if(!c || !w) return;
  const ctx = c.getContext('2d');
  c.width = w.offsetWidth; c.height = w.offsetHeight;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim() || '#fb7185';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✨ Rub with your finger ✨', c.width/2, c.height/2);
  ctx.globalCompositeOperation = 'destination-out';
  let drawing = false;
  const scratch = (e) => {
    if(!drawing) return;
    const rect = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
  };
  c.addEventListener('pointerdown', e=>{ drawing=true; scratch(e); });
  c.addEventListener('pointermove', scratch);
  window.addEventListener('pointerup', ()=>drawing=false);
}

// 9-Piece Swap Puzzle
let puzOrder = [], puzSel = -1, puzMoves = 0;
function initPuzzle(){
  const grid = document.getElementById('puzzleGrid');
  if(!grid) return;
  const photos = getPhotos();
  const imgUrl = photos[0].url;
  puzOrder = [0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-0.5);
  puzSel = -1; puzMoves = 0;
  drawPuzzle(imgUrl);
}
function drawPuzzle(imgUrl){
  const grid = document.getElementById('puzzleGrid');
  const p = PRESETS[state.mood] || PRESETS.girlfriend;
  const syms = ["💖","✨","🌹","🥰","💫","🎀","💌","🌸","💍"];
  grid.innerHTML = '';
  puzOrder.forEach((tileIdx, pos)=>{
    const d = document.createElement('div');
    d.className = 'p-tile' + (puzSel===pos?' sel':'');
    const r = Math.floor(tileIdx/3), c = tileIdx%3;
    if(imgUrl){
      d.style.backgroundImage = `url(${imgUrl})`;
      d.style.backgroundPosition = `${c*50}% ${r*50}%`;
    } else {
      d.style.background = '#fff';
      d.style.display = 'flex'; d.style.alignItems = 'center'; d.style.justifyContent = 'center';
      d.style.fontSize = '24px'; d.style.fontWeight = '800'; d.style.color = p.accent;
      d.textContent = syms[tileIdx];
    }
    d.onclick = ()=>{
      if(puzSel === -1){ puzSel = pos; }
      else if(puzSel === pos){ puzSel = -1; }
      else {
        [puzOrder[puzSel], puzOrder[pos]] = [puzOrder[pos], puzOrder[puzSel]];
        puzSel = -1; puzMoves++;
        document.getElementById('puzMoves').textContent = 'Moves: ' + puzMoves;
      }
      drawPuzzle(imgUrl);
    };
    grid.appendChild(d);
  });
}

function openNote(i){ openedNotes.add(i); render(); }
function breakSeal(){ letterUnsealed = true; render(); }
function toggleProm(i){ if(checkedProms.has(i)) checkedProms.delete(i); else checkedProms.add(i); render(); }

// Signature Pad
function initSigPad(){
  const c = document.getElementById('sigCanvas');
  if(!c) return;
  c.width = c.offsetWidth; c.height = 110;
  const ctx = c.getContext('2d');
  ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e11d48';
  let down = false;
  const pos = e => { const r = c.getBoundingClientRect(); const t = e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
  c.addEventListener('pointerdown', e=>{ down=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
  c.addEventListener('pointermove', e=>{ if(!down) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); if(!hasSigned){ hasSigned=true; document.querySelector('#app .btn').disabled = !(checkedProms.size>=state.promises.length && hasSigned); } });
  window.addEventListener('pointerup', ()=>down=false);
}
function clearSig(){ hasSigned = false; render(); }
function saveSigAndNext(){
  const c = document.getElementById('sigCanvas');
  if(c) sigDataUrl = c.toDataURL('image/png');
  nextStep();
}

// Dodging No + Growing Yes
function dodgeNo(){
  noDodges++;
  yesScale = Math.min(1.55, 1 + noDodges * 0.11);
  const yb = document.getElementById('yesBtn');
  const nb = document.getElementById('noBtn');
  if(yb) yb.style.transform = `scale(${yesScale})`;
  if(nb){
    const rx = (Math.random()*130 - 65).toFixed(0);
    const ry = (Math.random()*90 - 45).toFixed(0);
    nb.style.transform = `translate3d(${rx}px,${ry}px,0)`;
    const pleas = ["Are you sure? 🥺","Think again! 💔","Catch me first 😜","Pretty please? ✨","Wrong button! 👉"];
    nb.textContent = pleas[noDodges % pleas.length];
  }
}
function sayYes(){ step = 7; render(); }

function burstConfetti(emojis){
  const box = document.getElementById('particles');
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.className = 'pt';
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random()*94) + '%';
    s.style.fontSize = (22 + Math.random()*14) + 'px';
    s.style.animationDuration = (3 + Math.random()*2.5) + 's';
    box.appendChild(s);
    setTimeout(()=>s.remove(), 5500);
  }
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Secret Creator Studio (#studio)
let studioPhotos = [];
function checkHash(){
  if(location.hash === '#studio') openStudio();
}
window.addEventListener('hashchange', checkHash);

function openStudio(){
  document.getElementById('studioModal').style.display = 'block';
  renderMoodPills();
  document.getElementById('stTo').value = state.to === 'You' ? '' : state.to;
  document.getElementById('stFrom').value = state.from === 'Someone who loves you' ? '' : state.from;
  document.getElementById('stDays').value = state.days;
  document.getElementById('stSeal').value = state.seal;
  document.getElementById('stNotes').value = state.notes.join('
');
  document.getElementById('stLetter').value = state.letter;
  document.getElementById('stPromises').value = state.promises.join('
');
  document.getElementById('stQuestion').value = state.question;
  document.getElementById('stSubQ').value = state.subQ;
  document.getElementById('stGif').value = state.gif;
  document.getElementById('stAudio').value = state.audio;
  studioPhotos = [...state.photos];
  renderPhotoChips();
}
function closeStudio(){
  document.getElementById('studioModal').style.display = 'none';
  history.replaceState(null,'',location.pathname + location.search);
}
function renderMoodPills(){
  const box = document.getElementById('moodPills');
  box.innerHTML = Object.keys(PRESETS).map(k=>`<button type="button" class="m-pill ${state.mood===k?'active':''}" onclick="selectStudioMood('${k}')">${PRESETS[k].label}</button>`).join('');
}
function selectStudioMood(k){
  applyMoodDefaults(k, true);
  openStudio();
  render();
}

document.getElementById('stPhotoInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files).slice(0, 3 - studioPhotos.length);
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const c = document.createElement('canvas');
        const max = 420;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        studioPhotos.push({url: c.toDataURL('image/jpeg', 0.65), emoji:'📸', cap: file.name.replace(/\.[^.]+$/,'')});
        renderPhotoChips();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
});

function renderPhotoChips(){
  document.getElementById('photoChips').innerHTML = studioPhotos.map((p,i)=>`<span class="p-chip">📸 ${esc(p.cap.slice(0,14))} <b style="cursor:pointer;" onclick="studioPhotos.splice(${i},1);renderPhotoChips()">×</b></span>`).join('');
}

let generatedUrl = "";
function buildShareLink(){
  const payload = {
    mood: state.mood,
    to: document.getElementById('stTo').value.trim() || "You",
    from: document.getElementById('stFrom').value.trim() || "Someone who loves you",
    days: document.getElementById('stDays').value.trim(),
    seal: document.getElementById('stSeal').value.trim() || "💞",
    notes: document.getElementById('stNotes').value.split('
').map(s=>s.trim()).filter(Boolean).slice(0,4),
    letter: document.getElementById('stLetter').value.trim(),
    promises: document.getElementById('stPromises').value.split('
').map(s=>s.trim()).filter(Boolean).slice(0,4),
    question: document.getElementById('stQuestion').value.trim(),
    subQ: document.getElementById('stSubQ').value.trim(),
    gif: document.getElementById('stGif').value.trim(),
    audio: document.getElementById('stAudio').value.trim(),
    photos: studioPhotos
  };
  state = Object.assign(state, payload);
  applyMoodDefaults(state.mood, false);
  replayAll();
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  generatedUrl = `${location.origin}${location.pathname}?d=${encodeURIComponent(encoded)}`;
  const out = document.getElementById('shareOut');
  out.style.display = 'block';
  out.textContent = generatedUrl;
  document.getElementById('shareBtns').style.display = 'grid';
}
function copyShareLink(){
  navigator.clipboard.writeText(generatedUrl);
  alert('Private link copied! Ready to send.');
}
function shareWhatsApp(){
  window.open(`https://wa.me/?text=${encodeURIComponent('I made something special just for you ✨ ' + generatedUrl)}`, '_blank');
}

render();
checkHash();
